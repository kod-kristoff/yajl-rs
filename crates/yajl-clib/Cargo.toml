[package]
name = "yajl-clib"
version = { workspace = true }
edition = { workspace = true }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

nightly = []

[dependencies]
ffi_helpers = "0.3.0"
libc = { workspace = true }

yajl = { workspace = true }

[lib]
name = "yajl"
path = "src/yajl_clib.rs"
crate-type = ["staticlib", "cdylib"]
doctest = false
doc = false

[[test]]
name = "yajl-clib-api-tests"
path = "tests/api/yajl_clib_api_tests.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
